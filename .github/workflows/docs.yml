name: docs

on:
  push:
    branches: [main]
    paths:
      - "docsrc/**"
      - "src/torch_hailo/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Sphinx
        run: |
          python -m pip install --upgrade pip
          # CPU torch is enough for autodoc imports.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
          pip install torchao numpy onnx onnxscript
          pip install -r docsrc/requirements.txt
      - name: Build HTML
        run: sphinx-build -b html docsrc docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
